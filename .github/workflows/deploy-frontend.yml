name: Deploy Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to Vercel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-frontend
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_CLI_VERSION: "58.4.4"
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate deployment secrets
        shell: bash
        run: |
          for variable_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing required GitHub Environment secret: ${variable_name}" >&2
              exit 1
            fi
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel production configuration
        working-directory: frontend
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifacts
        working-directory: frontend
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel production artifacts
        id: deploy
        working-directory: frontend
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"

          if [[ "$deployment_url" != https://* ]]; then
            echo "Vercel CLI did not return a valid deployment URL." >&2
            exit 1
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $deployment_url"

      - name: Smoke-test production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          for url in \
            "$DEPLOYMENT_URL/" \
            "$DEPLOYMENT_URL/feed/teen" \
            "https://trendzip.nadoran.com/" \
            "https://trendzip.nadoran.com/feed/teen"; do
            echo "Checking $url"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --max-time 30 \
              --output /dev/null \
              "$url"
          done

      - name: Write deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Frontend production deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Vercel deployment: ${DEPLOYMENT_URL}"
            echo "- Production domain: https://trendzip.nadoran.com"
          } >> "$GITHUB_STEP_SUMMARY"
