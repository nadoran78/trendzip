spring:
  application:
    name: mztrend-backend
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/mztrend}
    username: ${POSTGRES_USERNAME:mztrend}
    password: ${POSTGRES_PASSWORD:mztrend}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  cache:
    type: redis
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false

server:
  port: ${PORT:8080}

external:
  youtube:
    base-url: ${YOUTUBE_BASE_URL:https://www.googleapis.com/youtube/v3}
    api-key: ${YOUTUBE_API_KEY:}
    connect-timeout-seconds: ${YOUTUBE_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${YOUTUBE_READ_TIMEOUT_SECONDS:5}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
