spring:
  application:
    name: mztrend-backend
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/mztrend}
    username: ${POSTGRES_USERNAME:mztrend}
    password: ${POSTGRES_PASSWORD:mztrend}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  cache:
    type: redis
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false

server:
  port: ${PORT:8080}

app:
  crawling-scheduler:
    enabled: ${APP_CRAWLING_SCHEDULER_ENABLED:true}
    cron: "${APP_CRAWLING_SCHEDULER_CRON:0 0 3 * * MON}"
    zone: "${APP_CRAWLING_SCHEDULER_ZONE:Asia/Seoul}"
    run-on-startup: ${APP_CRAWLING_SCHEDULER_RUN_ON_STARTUP:false}

external:
  youtube:
    base-url: ${YOUTUBE_BASE_URL:https://www.googleapis.com/youtube/v3}
    api-key: ${YOUTUBE_API_KEY:}
    connect-timeout-seconds: ${YOUTUBE_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${YOUTUBE_READ_TIMEOUT_SECONDS:5}
    region-code: ${YOUTUBE_REGION_CODE:KR}
    relevance-language: ${YOUTUBE_RELEVANCE_LANGUAGE:ko}
    safe-search: ${YOUTUBE_SAFE_SEARCH:moderate}
    popular-video-max-results: ${YOUTUBE_POPULAR_VIDEO_MAX_RESULTS:50}
    popular-video-category-id: ${YOUTUBE_POPULAR_VIDEO_CATEGORY_ID:}
    keyword-search-max-keywords: ${YOUTUBE_KEYWORD_SEARCH_MAX_KEYWORDS:10}
    keyword-search-max-results: ${YOUTUBE_KEYWORD_SEARCH_MAX_RESULTS:5}
  naver:
    base-url: ${NAVER_BASE_URL:https://openapi.naver.com/v1/datalab}
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    connect-timeout-seconds: ${NAVER_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${NAVER_READ_TIMEOUT_SECONDS:5}
    trend-period-days: ${NAVER_TREND_PERIOD_DAYS:30}
    time-unit: ${NAVER_TIME_UNIT:date}
    device: ${NAVER_DEVICE:mo}
    max-keyword-group-size: ${NAVER_MAX_KEYWORD_GROUP_SIZE:5}
    max-candidate-count: ${NAVER_MAX_CANDIDATE_COUNT:50}
    min-search-ratio: ${NAVER_MIN_SEARCH_RATIO:1.0}
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    connect-timeout-seconds: ${GEMINI_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${GEMINI_READ_TIMEOUT_SECONDS:60}
    max-explain-keyword-count: ${GEMINI_MAX_EXPLAIN_KEYWORD_COUNT:10}
    max-prompt-video-count: ${GEMINI_MAX_PROMPT_VIDEO_COUNT:3}
    rank-surge-threshold: ${GEMINI_RANK_SURGE_THRESHOLD:3}
    long-running-weeks: ${GEMINI_LONG_RUNNING_WEEKS:4}
    temperature: ${GEMINI_TEMPERATURE:0.3}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1024}
    thinking-level: ${GEMINI_THINKING_LEVEL:minimal}
    rate-limit-cooldown-seconds: ${GEMINI_RATE_LIMIT_COOLDOWN_SECONDS:60}
    explain-min-length: ${GEMINI_EXPLAIN_MIN_LENGTH:50}
    candidate-extraction-max-candidates: ${GEMINI_CANDIDATE_EXTRACTION_MAX_CANDIDATES:20}
    candidate-extraction-min-result-count: ${GEMINI_CANDIDATE_EXTRACTION_MIN_RESULT_COUNT:10}
    candidate-extraction-min-confidence: ${GEMINI_CANDIDATE_EXTRACTION_MIN_CONFIDENCE:0.6}
    candidate-extraction-max-prompt-videos: ${GEMINI_CANDIDATE_EXTRACTION_MAX_PROMPT_VIDEOS:20}
    candidate-extraction-max-description-length: ${GEMINI_CANDIDATE_EXTRACTION_MAX_DESCRIPTION_LENGTH:300}
    candidate-extraction-max-output-tokens: ${GEMINI_CANDIDATE_EXTRACTION_MAX_OUTPUT_TOKENS:4096}
