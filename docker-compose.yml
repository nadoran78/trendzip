services:
  postgres:
    image: postgres:16-alpine
    container_name: mztrend-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mztrend
      POSTGRES_USER: mztrend
      POSTGRES_PASSWORD: mztrend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mztrend -d mztrend"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mztrend-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
